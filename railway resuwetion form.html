<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Railway Reservation</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      padding: 40px 15px;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
    }

    .container {
      width: min(800px, 100%);
      margin: auto;
      background: white;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 25px 70px #0008;
    }

    .top {
      text-align: center;
      margin-bottom: 30px;
    }

    .top h1 {
      color: #0f172a;
      margin-bottom: 8px;
    }

    .top p {
      color: #64748b;
    }

    .home {
      display: inline-block;
      margin-bottom: 25px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    form {
      display: grid;
      gap: 18px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    label {
      font-weight: bold;
      color: #334155;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px #2563eb22;
    }

    .gender {
      display: flex;
      gap: 20px;
      padding-top: 5px;
    }

    .gender label {
      font-weight: normal;
    }

    .gender input {
      width: auto;
      margin-right: 5px;
    }

    button {
      margin-top: 10px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .reset {
      background: #e2e8f0;
      color: #0f172a;
    }

    .reset:hover {
      background: #cbd5e1;
    }

    #message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #dcfce7;
      color: #166534;
      text-align: center;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px 18px;
      }

      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <a href="index.html" class="home">← Back to Home</a>

  <div class="top">
    <h1>🚆 Railway Reservation</h1>
    <p>Enter passenger and journey details</p>
  </div>

  <form id="reservationForm">

    <div class="row">

      <div class="field">
        <label for="firstName">First Name</label>
        <input
          type="text"
          id="firstName"
          required
          placeholder="Enter first name"
        >
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input
          type="text"
          id="lastName"
          required
          placeholder="Enter last name"
        >
      </div>

    </div>

    <div class="row">

      <div class="field">
        <label for="from">Journey From</label>
        <input
          type="text"
          id="from"
          required
          placeholder="Starting station"
        >
      </div>

      <div class="field">
        <label for="to">Journey To</label>
        <input
          type="text"
          id="to"
          required
          placeholder="Destination station"
        >
      </div>

    </div>

    <div class="row">

      <div class="field">
        <label for="date">Journey Date</label>
        <input type="date" id="date" required>
      </div>

      <div class="field">
        <label for="class">Travel Class</label>

        <select id="class" required>
          <option value="">Select class</option>
          <option>Sleeper</option>
          <option>AC 3 Tier</option>
          <option>AC 2 Tier</option>
          <option>AC 1 Tier</option>
          <option>General</option>
        </select>
      </div>

    </div>

    <div class="row">

      <div class="field">
        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          pattern="[0-9]{10}"
          maxlength="10"
          required
          placeholder="10-digit number"
        >
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          required
          placeholder="example@email.com"
        >
      </div>

    </div>

    <div class="field">

      <label>Gender</label>

      <div class="gender">

        <label>
          <input type="radio" name="gender" value="Male" required>
          Male
        </label>

        <label>
          <input type="radio" name="gender" value="Female">
          Female
        </label>

        <label>
          <input type="radio" name="gender" value="Other">
          Other
        </label>

      </div>

    </div>

    <button type="submit">
      Book Ticket
    </button>

    <button type="reset" class="reset">
      Reset Form
    </button>

  </form>

  <div id="message"></div>

</div>

<script>

  const form = document.getElementById("reservationForm");
  const message = document.getElementById("message");
  const dateInput = document.getElementById("date");

  const today = new Date().toISOString().split("T")[0];
  dateInput.min = today;

  form.addEventListener("submit", function(event) {

    event.preventDefault();

    const firstName =
      document.getElementById("firstName").value.trim();

    const lastName =
      document.getElementById("lastName").value.trim();

    const from =
      document.getElementById("from").value.trim();

    const to =
      document.getElementById("to").value.trim();

    message.style.display = "block";

    message.textContent =
      `✅ Reservation request submitted for ${firstName} ${lastName}: ${from} → ${to}.`;

  });

</script>

</body>
</html>
